# Builds the 405-fixed image (branch fix-405) and publishes it to GHCR so a
# Coolify "Service" (which can only pull images) can use it.
name: fix-405 image

on:
  push:
    branches: [fix-405]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: VERSION=0.7.2-fix405
          tags: ghcr.io/alexmelo/evolution-go:0.7.2-fix405
          labels: org.opencontainers.image.source=https://github.com/alexmelo/evolution-go
